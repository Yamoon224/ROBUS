name: Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration à exécuter seule (nom du fichier sans .php), vide pour aucune'
        required: false
        default: ''

# Un seul déploiement à la fois ; un push pendant un déploiement attend la fin du précédent.
concurrency:
  group: deployment-production
  cancel-in-progress: false

env:
  # À aligner sur le serveur (Settings → Secrets and variables → Actions → Variables).
  PHP_VERSION: ${{ vars.PHP_VERSION || '8.1' }}
  PHP_BIN: ${{ vars.PHP_BIN || 'php' }}

jobs:
  # Tout est construit et vérifié ici : si ce job échoue, le serveur n'est pas touché.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Le mutualisé n'a ni composer ni npm : tout est construit ici puis envoyé.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: |
          errors=$(find app bootstrap config database routes -name '*.php' -not -path 'bootstrap/cache/*' -print0 \
            | xargs -0 -n1 -P4 php -l 2>&1 | grep -E 'Parse error|Fatal error|Errors parsing' || true)
          if [ -n "$errors" ]; then
            echo "$errors"
            exit 1
          fi

      - name: Dépendances PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Build des assets
        run: |
          npm ci
          npm run build

      - name: Préparer la release
        run: |
          # Le .htaccess racine du dépôt est celui du dossier parent sur le serveur :
          # envoyé dans le dossier du site, il crée une boucle de redirection (erreur 500).
          mkdir -p "$RUNNER_TEMP/release"
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='.env' --exclude='.env.*' --exclude='/.htaccess' \
            --exclude='storage/' --exclude='bootstrap/cache/' --exclude='tests/' \
            --exclude='/docs/' --exclude='/*.md' --exclude='/laravel.log' \
            ./ "$RUNNER_TEMP/release/"
          test -f "$RUNNER_TEMP/release/vendor/autoload.php"
          test -f "$RUNNER_TEMP/release/public/build/manifest.json"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 3
          compression-level: 0

  # Sans mode maintenance : la release est d'abord envoyée dans un dossier d'attente hors
  # du site, puis copiée d'un coup sur place. Le site répond pendant tout le déploiement.
  deploy:
    name: Deployment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Extraire la release
        run: |
          mkdir release
          tar -xzf release.tar.gz -C release

      - name: Préparer la connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
          EOF

          # ~/remote : exécute sur le serveur, dans le dossier du site, le script reçu
          # sur l'entrée standard. `artisan` y masque les avertissements "Deprecated"
          # émis par un PHP plus récent que celui prévu pour Laravel 9.
          cat > ~/remote <<'EOF'
          #!/usr/bin/env bash
          {
            cat <<'PRELUDE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          STAGING="$HOME/.robus_deploy/release"
          artisan() { $PHP_BIN artisan "$@" 2>&1 | sed '/Deprecated: /d'; }
          PRELUDE
            cat
          } | ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash -s"
          EOF
          chmod +x ~/remote

      # Étape lente (réseau) : elle n'écrit que dans le dossier d'attente, le site n'est pas touché.
      - name: Envoi vers le dossier d'attente
        run: |
          ssh deploy 'mkdir -p .robus_deploy/release'
          rsync -az --delete ./release/ deploy:.robus_deploy/release/

      - name: Mise en ligne
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          if [[ -n "$MIGRATION" && ! "$MIGRATION" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "Nom de migration invalide : $MIGRATION" >&2
            exit 1
          fi

          ~/remote <<'REMOTE'
          test -f "$STAGING/artisan"
          test -f "$STAGING/vendor/autoload.php"

          # Copie locale, donc rapide : chaque fichier est remplacé d'un coup par rsync.
          # Rien n'est supprimé ici : .env, storage/ et les fichiers déposés par les
          # utilisateurs dans public/ (KYC, profils, QR codes...) restent en place.
          rsync -a "$STAGING/" ./

          # Dossiers de code uniquement : on retire les fichiers supprimés du dépôt.
          for dir in app config database/migrations resources routes vendor; do
            rsync -a --delete "$STAGING/$dir/" "./$dir/"
          done

          # Les anciens fichiers compilés restent une semaine pour les pages déjà ouvertes.
          find public/build/assets -type f -mtime +7 -delete 2>/dev/null || true

          # Le nouveau vendor (--no-dev) n'a plus les paquets de dev : manifeste régénéré.
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php

          artisan package:discover

          # Migrations désactivées par défaut : la table `migrations` de production ne
          # reflète pas le schéma réel. Variable RUN_MIGRATIONS=true pour les réactiver.
          if [ "${{ vars.RUN_MIGRATIONS || 'false' }}" = "true" ]; then
            artisan migrate --force
          fi

          # Lancement manuel avec une migration nommée : elle seule est exécutée,
          # les autres migrations en attente ne sont pas touchées.
          if [ -n "${{ inputs.migration }}" ]; then
            artisan migrate --force --path="database/migrations/${{ inputs.migration }}.php"
          fi

          # Pas de config:cache : le code lit env() directement (APP_URL, APP_NAME...),
          # ce qui renvoie null une fois la configuration mise en cache.
          # Pas de route:cache : la sérialisation des routes épuise la mémoire (1 Go).
          artisan config:clear
          artisan route:clear
          artisan view:clear

          # Précompilation facultative : une vue inutilisée (book-a-table) référence un
          # composant absent et fait échouer view:cache ; les vues se compilent sinon à la demande.
          artisan view:cache || echo "view:cache ignoré"

          # Les liens symboliques sont parfois interdits en mutualisé : non bloquant.
          artisan storage:link || true

          # Sans effet si aucun worker ne tourne (QUEUE_CONNECTION=sync).
          artisan queue:restart
          REMOTE

      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/deploy_key
